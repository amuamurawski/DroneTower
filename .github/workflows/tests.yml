name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # Without this the cache step looks only for requirements.txt or
          # pyproject.toml, finds neither, and fails the whole job.
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: pytest
