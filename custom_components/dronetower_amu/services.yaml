get_history:
  fields:
    days:
      selector:
        number:
          min: 1
          max: 3650
          mode: box
      example: 30
    limit:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
      example: 100
    operator:
      selector:
        text:
      example: 9f2c4a1b7e0d3c85
    only_returning:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: dronetower_amu

get_operators:
  fields:
    days:
      selector:
        number:
          min: 1
          max: 3650
          mode: box
      example: 365
    min_flights:
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: dronetower_amu

get_operator:
  fields:
    operator:
      required: true
      selector:
        text:
      example: 9f2c4a1b7e0d3c85
    config_entry_id:
      selector:
        config_entry:
          integration: dronetower_amu

purge_history:
  fields:
    older_than_days:
      selector:
        number:
          min: 1
          max: 3650
          mode: box
      example: 90
    operator:
      selector:
        text:
      example: 9f2c4a1b7e0d3c85
    config_entry_id:
      selector:
        config_entry:
          integration: dronetower_amu
